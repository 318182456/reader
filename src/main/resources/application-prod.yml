spring:
  profiles:
    active: prod

reader:
  app:
    storagePath: 'storage'
    showUI: false
    debug: false
    packaged: false
    secure: false
    inviteCode: ""
    secureKey: ""
    proxy: false
    proxyType: "HTTP"
    proxyHost: ""
    proxyPort: ""
    proxyUsername: ""
    proxyPassword: ""
    cacheChapterContent: true
    # 简繁转换，与 App 设置保持一致：0=不转 1=繁转简 2=简转繁
    chineseConverterType: 0
    userLimit: 50
    userBookLimit: 200
    debugLog: false
    autoClearInactiveUser: 0

  server:
    port: 8080
    webUrl: http://localhost:${reader.server.port}

logging:
  path: "./logs"